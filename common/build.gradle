plugins {
    id "com.github.johnrengelman.shadow"
}

architectury {
    common(rootProject.enabled_platforms.split(","))
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    // Minecraft mappings provided by root
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"

    // Architectury API (common compile-only)
    modApi "dev.architectury:architectury:${project.architectury_version}"

    // Cloth Config (common compile-only — actual impl provided per platform)
    modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
}
